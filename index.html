<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfoPet · Maquetas</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,Inter,sans-serif;background:#0C1210;color:#f5f5f5;min-height:100vh;padding:40px 20px}
  .container{max-width:900px;margin:0 auto}
  h1{font-size:32px;font-weight:600;margin-bottom:8px;background:linear-gradient(135deg,#2D6A4F,#5AC8FA);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  p{color:#9aa;margin-bottom:32px;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  a{display:block;padding:18px 20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#f5f5f5;text-decoration:none;transition:all .2s;backdrop-filter:blur(10px)}
  a:hover{background:rgba(45,106,79,0.15);border-color:#2D6A4F;transform:translateY(-2px)}
  .name{font-weight:500;font-size:15px;margin-bottom:4px}
  .date{font-size:12px;color:#6c7}
  footer{margin-top:40px;text-align:center;color:#566;font-size:12px}
</style>
</head>
<body>
<!-- SMC PIN GATE · v6 · PIN: hoku ·-->
<style>
#smcPinGate{position:fixed;inset:0;z-index:99999;background:#0A0E14;display:flex;align-items:center;justify-content:center;font-family:'Inter','72',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;padding:24px}
#smcPinGate::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(0,229,176,.08) 0%,transparent 50%),radial-gradient(circle at 70% 60%,rgba(0,112,242,.06) 0%,transparent 50%);pointer-events:none}
#smcPinGate .pc{position:relative;background:rgba(20,28,38,.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(0,229,176,.18);border-radius:20px;padding:40px 44px 36px;max-width:640px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
#smcPinGate .pb{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:22px}
#smcPinGate .pc-cloud{width:42px;height:42px;flex-shrink:0;color:#00E5B0;filter:drop-shadow(0 0 8px rgba(0,229,176,.5))}
#smcPinGate .pn{font-size:28px;font-weight:700;letter-spacing:.14em;line-height:1}
#smcPinGate .pn .s{color:#fff}#smcPinGate .pn .c{color:#00E5B0}
#smcPinGate h2{font-size:24px;font-weight:700;color:#fff;letter-spacing:-.02em;margin:0 0 6px}
#smcPinGate p.sub{font-size:13.5px;color:rgba(255,255,255,.5);margin:0 0 22px;letter-spacing:.01em}
#smcPinGate .bxs{display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
#smcPinGate .bx{width:56px;height:64px;background:rgba(10,18,26,.7);border:1.5px solid rgba(255,255,255,.08);border-radius:12px;font-size:26px;font-weight:700;color:#fff;text-align:center;outline:none;text-transform:uppercase;font-family:inherit;caret-color:transparent;transition:all 220ms cubic-bezier(0.65,0.05,0.36,1)}
#smcPinGate .bx:focus{border-color:#00E5B0;box-shadow:0 0 0 4px rgba(0,229,176,.15),0 0 20px rgba(0,229,176,.25)}
#smcPinGate .bx.f{border-color:rgba(0,229,176,.5);background:rgba(0,229,176,.05)}
#smcPinGate .ht{font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.04em;margin-bottom:6px}
#smcPinGate .er{font-size:12.5px;color:#FF8484;height:18px;font-weight:500;opacity:0;transition:opacity 220ms ease}
#smcPinGate .er.s{opacity:1}
#smcPinGate .ft{font-size:10.5px;color:rgba(255,255,255,.3);margin-top:18px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
@keyframes smcShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#smcPinGate .bxs.sh{animation:smcShake 350ms cubic-bezier(0.36,0.07,0.19,0.97)}
</style>
<div id="smcPinGate">
  <div class="pc">
    <div class="pb">
      <svg class="pc-cloud" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M48 44H18a10 10 0 0 1 0-20 14 14 0 0 1 27.4 4A8 8 0 1 1 48 44z"/><path d="M28 32l4 4 8-8" stroke-width="2.5"/></svg>
      <div class="pn"><span class="s">SMART</span><span class="c">CO3ECTION</span></div>
    </div>
    <h2>InfoPet · Maquetas</h2>
    <p class="sub">Ingresa tu PIN de acceso</p>
    <div class="bxs" id="smcPinBxs">
      <input class="bx" type="text" maxlength="1" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text">
      <input class="bx" type="text" maxlength="1" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text">
      <input class="bx" type="text" maxlength="1" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text">
      <input class="bx" type="text" maxlength="1" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text">
    </div>
    <div class="ht">4 caracteres</div>
    <div class="er" id="smcPinErr"></div>
    <div class="ft">SMC Connection SpA · acceso autorizado</div>
  </div>
</div>
<script>
(function(){
  var PIN = "HOKU";
  var KEY = "infopet";
  var V = "v6";
  var g = document.getElementById("smcPinGate");
  var w = document.getElementById("smcPinBxs");
  var bx = w.querySelectorAll(".bx");
  var er = document.getElementById("smcPinErr");
  var skey = "smc_pin_" + KEY + "_" + V;
  var vkey = "smc_pin_v_" + KEY;
  if (localStorage.getItem(vkey) !== V){
    Object.keys(sessionStorage).forEach(function(k){ if (k.indexOf("smc_pin_" + KEY) === 0) sessionStorage.removeItem(k); });
    localStorage.setItem(vkey, V);
  }
  if (sessionStorage.getItem(skey) === "1"){ g.style.display = "none"; }
  else { setTimeout(function(){ bx[0].focus(); }, 200); }
  function code(){ return Array.from(bx).map(function(b){ return (b.value||"").toUpperCase(); }).join(""); }
  function val(){
    var c = code();
    if (c.length < 4) return;
    if (c === PIN){
      sessionStorage.setItem(skey, "1");
      bx.forEach(function(b){ b.classList.add("f"); });
      g.style.transition = "opacity 400ms ease, transform 400ms ease";
      setTimeout(function(){ g.style.opacity = "0"; g.style.transform = "scale(1.04)"; }, 200);
      setTimeout(function(){ g.style.display = "none"; }, 600);
    } else {
      er.textContent = "PIN incorrecto · intenta de nuevo";
      er.classList.add("s");
      w.classList.add("sh");
      setTimeout(function(){
        w.classList.remove("sh");
        bx.forEach(function(b){ b.value = ""; b.classList.remove("f"); });
        bx[0].focus();
        setTimeout(function(){ er.classList.remove("s"); }, 1200);
      }, 380);
    }
  }
  bx.forEach(function(b, i){
    b.addEventListener("input", function(e){
      var v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
      e.target.value = v;
      if (v) e.target.classList.add("f"); else e.target.classList.remove("f");
      if (v && i < bx.length - 1) bx[i+1].focus();
      if (i === bx.length - 1 && v) setTimeout(val, 80);
    });
    b.addEventListener("keydown", function(e){
      if (e.key === "Backspace" && !b.value && i > 0) bx[i-1].focus();
      if (e.key === "Enter") val();
    });
    b.addEventListener("paste", function(e){
      e.preventDefault();
      var t = (e.clipboardData||window.clipboardData).getData("text").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);
      bx.forEach(function(box, idx){ box.value = t[idx] || ""; if (t[idx]) box.classList.add("f"); });
      if (t.length === 4) setTimeout(val, 80);
      else bx[Math.min(t.length, 3)].focus();
    });
  });
})();
</script>



<div class="container">
  <h1>🐾 InfoPet · Maquetas</h1>
  <p>Galería de maquetas HTML de Smart Connection — InfoPet Reñaca</p>
  <div class="grid" id="grid"></div>
  <footer>Powered by GitHub Pages · SmartConnection-CodeHub/infopet-maquetas</footer>
</div>
<script>
const files = [  "2026-05-25-jumpseller-cobertura.html",  "2026-05-18-mor-proveedor.html",  "2026-05-13-dashboard.html",  "2026-05-13-pedidos-dark.html",  "2026-03-23-infopet-contraste-fix.html",  "2026-03-24-infopet-contraste-fix-v2.html",  "2026-04-02-recepcion-automatica.html",  "2026-04-07-display-logic.html",  "2026-04-07-facturas-ocr-mobile.html",  "2026-04-07-infopet-renaca-desktop.html",  "2026-04-07-infopet-renaca-fusion.html",  "2026-04-07-mobile-dashboard.html",  "2026-04-07-renaca-wallpaper-mobile.html",  "2026-04-07-renaca-wallpaper.html",  "2026-04-07-reporte-gerencial-javier.html",  "2026-04-08-tsukai-chat-widget.html",  "2026-04-15_163000-facturas-desktop.html",  "2026-04-15_164500-facturas-mobile.html",  "infopet-gerente.html",  "infopet-presentacion-comercial.html",  "infopet-presentacion-comercial_1.html",  "infopet-propuesta-economica.html",  "infopet-propuesta.html",  "infopet-propuesta_1.html",  "infopet-roadmap-2026-03-28.html",  "infopet_dashboard.html"];
const grid = document.getElementById('grid');
files.sort().reverse().forEach(f => {
  const a = document.createElement('a'); a.href = f;
  const name = f.replace(/\.html$/,'').replace(/^\d{4}-\d{2}-\d{2}[_-]?\d*-?/, '').replace(/-/g,' ');
  const dateMatch = f.match(/^(\d{4}-\d{2}-\d{2})/);
  a.innerHTML = '<div class="name">' + name + '</div>' + (dateMatch ? '<div class="date">' + dateMatch[1] + '</div>' : '');
  grid.appendChild(a);
});
</script>
</body>
</html>
